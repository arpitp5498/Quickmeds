<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_nasoclear_drops" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow_nasoclear_drops" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_nasoclear_drops)" rx="20"/>
  
  <!-- Category Badge -->
  <rect x="24" y="20" width="148" height="22" rx="11" fill="#ffffff" opacity="0.9"/>
  <text x="35" y="35" fill="#0284c7" font-family="Arial,sans-serif" font-size="9.5" font-weight="bold" letter-spacing="0.5">NASAL CARE • DROPS</text>

  <!-- Product Illustration -->
  <g filter="url(#shadow_nasoclear_drops)">
    <!-- Shadow -->
  <ellipse cx="200" cy="278" rx="56" ry="8" fill="#94a3b8" opacity="0.35"/>
  <!-- Dropper Bulb -->
  <path d="M185 54 C185 38 215 38 215 54 L215 64 L185 64 Z" fill="#0284c7"/>
  <!-- Dropper Collar / Cap -->
  <rect x="174" y="64" width="52" height="26" rx="4" fill="#0ea5e9"/>
  <line x1="184" y1="66" x2="184" y2="88" stroke="#0284c7" stroke-width="2"/>
  <line x1="194" y1="66" x2="194" y2="88" stroke="#0284c7" stroke-width="2"/>
  <line x1="206" y1="66" x2="206" y2="88" stroke="#0284c7" stroke-width="2"/>
  <line x1="216" y1="66" x2="216" y2="88" stroke="#0284c7" stroke-width="2"/>
  <!-- Bottle Neck Ring -->
  <rect x="180" y="90" width="40" height="8" rx="2" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
  <!-- Dropper Bottle Body -->
  <rect x="140" y="98" width="120" height="175" rx="14" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="144" y="104" width="8" height="162" rx="4" fill="#f0f9ff"/>
  <!-- Bottle Label -->
  <rect x="149" y="128" width="102" height="126" rx="6" fill="#0284c7"/>
  <rect x="149" y="128" width="102" height="26" rx="6" fill="#0369a1"/>
  <text x="200" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="11.5" fill="#ffffff" letter-spacing="0.5">NASOCLEAR</text>
  <rect x="156" y="159" width="88" height="16" rx="3" fill="#bae6fd"/>
  <text x="200" y="171" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="9" fill="#0369a1">PAEDIATRIC DROPS</text>
  <text x="200" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff">Saline 0.65%</text>
  <text x="200" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#e0f2fe">Isotonic Solution</text>
  <line x1="165" y1="222" x2="235" y2="222" stroke="#38bdf8" stroke-width="1"/>
  <text x="200" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="11" fill="#ffffff">15 ml</text>
  </g>

  <!-- Product Labels Bottom -->
  <text x="200" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="20" fill="#1e293b">Nasoclear Paediatric Drops</text>
  <text x="200" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">Saline Nasal Drops 0.65% (15ml)</text>
  <text x="200" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Cipla</text>
</svg>