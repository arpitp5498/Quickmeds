<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_enerzal_powder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="shadow_enerzal_powder" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_enerzal_powder)" rx="20"/>
  
  <!-- Category Badge -->
  <rect x="24" y="20" width="211" height="22" rx="11" fill="#ffffff" opacity="0.9"/>
  <text x="35" y="35" fill="#ea580c" font-family="Arial,sans-serif" font-size="9.5" font-weight="bold" letter-spacing="0.5">ENERGY • ELECTROLYTE POWDER</text>

  <!-- Product Illustration -->
  <g filter="url(#shadow_enerzal_powder)">
    <!-- Shadow -->
  <ellipse cx="200" cy="278" rx="60" ry="8" fill="#94a3b8" opacity="0.35"/>
  <!-- Container Lid -->
  <rect x="165" y="55" width="70" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="172" y1="62" x2="172" y2="76" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="184" y1="62" x2="184" y2="76" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="200" y1="62" x2="200" y2="76" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="216" y1="62" x2="216" y2="76" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="228" y1="62" x2="228" y2="76" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Canister Body -->
  <rect x="136" y="83" width="128" height="191" rx="14" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/>
  <!-- Lightning energy motif -->
  <polygon points="204,95 190,120 198,120 192,142 208,118 200,118" fill="#fef08a"/>
  <!-- Center Label -->
  <rect x="144" y="146" width="112" height="96" rx="6" fill="#ffffff"/>
  <text x="200" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="13.5" fill="#ea580c" letter-spacing="1">ENERZAL</text>
  <rect x="152" y="176" width="96" height="16" rx="3" fill="#ffedd5"/>
  <text x="200" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="8" fill="#c2410c">ENERGY &amp; ELECTROLYTE</text>
  <text x="200" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" font-weight="bold" fill="#0f172a">Orange Powder</text>
  <line x1="156" y1="220" x2="244" y2="220" stroke="#fed7aa" stroke-width="1"/>
  <text x="200" y="234" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="10.5" fill="#ea580c">100 g</text>
  </g>

  <!-- Product Labels Bottom -->
  <text x="200" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="20" fill="#1e293b">Enerzal Energy Drink Powder</text>
  <text x="200" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">Electrolyte & Energy Orange (100g)</text>
  <text x="200" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">FDC Ltd</text>
</svg>