<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_electral_rtd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="shadow_electral_rtd" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_electral_rtd)" rx="20"/>
  
  <!-- Category Badge -->
  <rect x="24" y="20" width="218" height="22" rx="11" fill="#ffffff" opacity="0.9"/>
  <text x="35" y="35" fill="#15803d" font-family="Arial,sans-serif" font-size="9.5" font-weight="bold" letter-spacing="0.5">ELECTROLYTE • READY TO DRINK</text>

  <!-- Product Illustration -->
  <g filter="url(#shadow_electral_rtd)">
    <!-- Shadow -->
  <ellipse cx="200" cy="278" rx="60" ry="8" fill="#94a3b8" opacity="0.35"/>
  <!-- Attached Straw on side -->
  <path d="M255 70 L255 250" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <path d="M255 70 L255 250" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  <path d="M255 70 L248 56" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <!-- Tetra Pak Carton Body -->
  <rect x="140" y="70" width="112" height="205" rx="8" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <!-- Top carton fold edge -->
  <polygon points="140,70 196,55 252,70" fill="#15803d"/>
  <circle cx="196" cy="62" r="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <!-- Apple graphic / emblem -->
  <circle cx="196" cy="115" r="22" fill="#ffffff"/>
  <circle cx="196" cy="116" r="16" fill="#84cc16"/>
  <path d="M196 100 Q200 95 204 98" stroke="#15803d" stroke-width="2" fill="none"/>
  <!-- Electral Label -->
  <text x="196" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="1">ELECTRAL</text>
  <rect x="148" y="170" width="96" height="18" rx="4" fill="#ffffff"/>
  <text x="196" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="8.5" fill="#15803d">READY-TO-DRINK</text>
  <text x="196" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Apple Flavor</text>
  <text x="196" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#bbf7d0">WHO Standard ORS</text>
  <line x1="155" y1="236" x2="237" y2="236" stroke="#22c55e" stroke-width="1"/>
  <text x="196" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="11" fill="#fef08a">200 ml</text>
  </g>

  <!-- Product Labels Bottom -->
  <text x="200" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="20" fill="#1e293b">Electral RTD ORS Apple</text>
  <text x="200" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">Ready-to-Drink ORS Apple (200ml)</text>
  <text x="200" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">FDC Ltd</text>
</svg>