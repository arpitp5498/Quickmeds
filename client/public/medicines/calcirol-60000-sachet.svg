<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_calcirol_sachet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="shadow_calcirol_sachet" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_calcirol_sachet)" rx="20"/>
  
  <!-- Category Badge -->
  <rect x="24" y="20" width="162" height="22" rx="11" fill="#ffffff" opacity="0.9"/>
  <text x="35" y="35" fill="#ea580c" font-family="Arial,sans-serif" font-size="9.5" font-weight="bold" letter-spacing="0.5">VITAMINS • D3 SACHET</text>

  <!-- Product Illustration -->
  <g filter="url(#shadow_calcirol_sachet)">
    <!-- Shadow -->
  <ellipse cx="200" cy="278" rx="60" ry="8" fill="#94a3b8" opacity="0.35"/>
  <!-- Sachet Body -->
  <rect x="136" y="70" width="128" height="205" rx="6" fill="#f97316" stroke="#ea580c" stroke-width="1.5"/>
  <!-- Top and Bottom crimp borders -->
  <line x1="136" y1="78" x2="264" y2="78" stroke="#fdba74" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="136" y1="267" x2="264" y2="267" stroke="#fdba74" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Tear notch -->
  <polygon points="136,92 144,97 136,102" fill="#fff7ed"/>
  <!-- Radiating Sun motif -->
  <circle cx="200" cy="118" r="16" fill="#fef08a"/>
  <line x1="200" y1="96" x2="200" y2="92" stroke="#fef08a" stroke-width="2"/>
  <line x1="200" y1="140" x2="200" y2="144" stroke="#fef08a" stroke-width="2"/>
  <line x1="178" y1="118" x2="174" y2="118" stroke="#fef08a" stroke-width="2"/>
  <line x1="222" y1="118" x2="226" y2="118" stroke="#fef08a" stroke-width="2"/>
  <!-- Brand Label -->
  <text x="200" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="1">CALCIROL</text>
  <rect x="150" y="170" width="100" height="20" rx="4" fill="#ffffff"/>
  <text x="200" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="10" fill="#ea580c">60,000 IU</text>
  <text x="200" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Cholecalciferol</text>
  <text x="200" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#fef08a">Vitamin D3 Granules</text>
  <line x1="155" y1="236" x2="245" y2="236" stroke="#fb923c" stroke-width="1"/>
  <text x="200" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="11" fill="#ffffff">1 g Sachet</text>
  </g>

  <!-- Product Labels Bottom -->
  <text x="200" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="20" fill="#1e293b">Calcirol 60,000 IU Sachet</text>
  <text x="200" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">Cholecalciferol Granules (1g)</text>
  <text x="200" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Cadila</text>
</svg>