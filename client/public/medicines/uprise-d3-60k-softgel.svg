<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="packGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <radialGradient id="softgelGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="20"/>
  <!-- Softgel Blister Pack -->
  <g filter="url(#shadow)">
    <!-- Base Foil Strip -->
    <rect x="56" y="66" width="288" height="198" rx="14" fill="url(#packGrad)" stroke="#94a3b8" stroke-width="1.5"/>
    
    <!-- Top Foil / Brand Bar -->
    <rect x="56" y="66" width="288" height="34" rx="14" fill="#b45309"/>
    <rect x="56" y="85" width="288" height="15" fill="#b45309"/>
    <text x="74" y="88" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="0.5">UPRISE-D3 60K • Alkem</text>
    
    <!-- Perforations and Grid lines -->
