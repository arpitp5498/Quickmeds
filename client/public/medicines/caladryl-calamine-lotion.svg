<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_caladryl_lotion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <filter id="shadow_caladryl_lotion" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_caladryl_lotion)" rx="20"/>
  
  <!-- Category Badge -->
  <rect x="24" y="20" width="162" height="22" rx="11" fill="#ffffff" opacity="0.9"/>
  <text x="35" y="35" fill="#db2777" font-family="Arial,sans-serif" font-size="9.5" font-weight="bold" letter-spacing="0.5">DERMATOLOGY • LOTION</text>

  <!-- Product Illustration -->
  <g filter="url(#shadow_caladryl_lotion)">
    <!-- Shadow -->
  <ellipse cx="200" cy="278" rx="60" ry="8" fill="#94a3b8" opacity="0.35"/>
  <!-- White Cap -->
  <rect x="176" y="65" width="48" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="184" y1="72" x2="184" y2="88" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="200" y1="72" x2="200" y2="88" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="216" y1="72" x2="216" y2="88" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Bottle Neck -->
  <rect x="184" y="95" width="32" height="15" fill="#fbcfe8"/>
  <!-- Calamine Pink Bottle Body -->
  <path d="M138 122 Q138 110 168 110 L232 110 Q262 110 262 122 L262 262 Q262 276 244 276 L156 276 Q138 276 138 262 Z" fill="#f472b6" stroke="#db2777" stroke-width="1.5"/>
  <rect x="144" y="118" width="8" height="150" rx="4" fill="#fdf2f8" opacity="0.5"/>
  <!-- Bottle Label -->
  <rect x="146" y="132" width="108" height="122" rx="6" fill="#ffffff"/>
  <rect x="146" y="132" width="108" height="28" rx="6" fill="#db2777"/>
  <text x="200" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="12" fill="#ffffff" letter-spacing="0.5">CALADRYL</text>
  <rect x="156" y="165" width="88" height="16" rx="3" fill="#fce7f3"/>
  <text x="200" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="8" fill="#9d174d">CALAMINE LOTION</text>
  <text x="200" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#0f172a">Skin Soothing</text>
  <text x="200" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#64748b">Calamine 8%</text>
  <line x1="165" y1="225" x2="235" y2="225" stroke="#fbcfe8" stroke-width="1"/>
  <text x="200" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="10.5" fill="#db2777">120 ml</text>
  </g>

  <!-- Product Labels Bottom -->
  <text x="200" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="20" fill="#1e293b">Caladryl Calamine Lotion</text>
  <text x="200" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">Calamine + Diphenhydramine (120ml)</text>
  <text x="200" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Piramal</text>
</svg>