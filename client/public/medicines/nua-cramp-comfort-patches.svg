<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_nua_patches" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <filter id="shadow_nua_patches" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_nua_patches)" rx="20"/>
  
  <!-- Category Badge -->
  <rect x="24" y="20" width="197" height="22" rx="11" fill="#ffffff" opacity="0.9"/>
  <text x="35" y="35" fill="#f43f5e" font-family="Arial,sans-serif" font-size="9.5" font-weight="bold" letter-spacing="0.5">WOMEN CARE • HEAT THERAPY</text>

  <!-- Product Illustration -->
  <g filter="url(#shadow_nua_patches)">
    <!-- Shadow -->
  <ellipse cx="200" cy="278" rx="60" ry="8" fill="#94a3b8" opacity="0.35"/>
  <!-- Box Body -->
  <rect x="135" y="70" width="130" height="205" rx="14" fill="#fb7185" stroke="#f43f5e" stroke-width="1.5"/>
  <!-- Curved organic accent -->
  <path d="M135 150 Q170 125 200 145 T265 130 L265 261 Q265 275 251 275 L149 275 Q135 275 135 261 Z" fill="#fda4af" opacity="0.5"/>
  <!-- Nua Logo text -->
  <text x="200" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="1">nua</text>
  <!-- Thermal warmth waves icon -->
  <path d="M188 128 Q192 122 188 116" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M196 128 Q200 122 196 116" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M204 128 Q208 122 204 116" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M212 128 Q216 122 212 116" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Label Banner -->
  <rect x="146" y="156" width="108" height="22" rx="4" fill="#ffffff"/>
  <text x="200" y="171" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="9" fill="#e11d48">CRAMP COMFORT</text>
  <text x="200" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Heat Therapy Patch</text>
  <text x="200" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#ffe4e6">8-Hour Warmth Relief</text>
  <line x1="155" y1="228" x2="245" y2="228" stroke="#f43f5e" stroke-width="1"/>
  <text x="200" y="248" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="11" fill="#ffffff">Pack of 3</text>
  </g>

  <!-- Product Labels Bottom -->
  <text x="200" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="20" fill="#1e293b">Nua Cramp Comfort Patches</text>
  <text x="200" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">Heat Therapy Patches (3 Patches)</text>
  <text x="200" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Nua</text>
</svg>