<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="pack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="20"/>
  <!-- Blister pack -->
  <rect x="60" y="80" width="280" height="180" rx="12" fill="url(#pack)" stroke="#94a3b8" stroke-width="1"/>
  <!-- Pill blisters -->
  <g fill="white" opacity="0.9">
    <ellipse cx="130" cy="140" rx="22" ry="14"/>
    <ellipse cx="200" cy="140" rx="22" ry="14"/>
    <ellipse cx="270" cy="140" rx="22" ry="14"/>
    <ellipse cx="130" cy="185" rx="22" ry="14"/>
    <ellipse cx="200" cy="185" rx="22" ry="14"/>
    <ellipse cx="270" cy="185" rx="22" ry="14"/>
    <ellipse cx="130" cy="230" rx="22" ry="14"/>
    <ellipse cx="200" cy="230" rx="22" ry="14"/>
    <ellipse cx="270" cy="230" rx="22" ry="14"/>
  </g>
  <!-- Brand name -->
  <text x="200" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="22" fill="#1e293b">Cetzine 10mg</text>
  <!-- Strength -->
  <text x="200" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">10mg | Cetirizine</text>
  <!-- Manufacturer -->
  <text x="200" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8">Dr. Reddy's</text>
</svg>
