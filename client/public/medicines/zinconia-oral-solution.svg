<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_zinconia_sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="shadow_zinconia_sol" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_zinconia_sol)" rx="20"/>
  
  <!-- Category Badge -->
  <rect x="24" y="20" width="204" height="22" rx="11" fill="#ffffff" opacity="0.9"/>
  <text x="35" y="35" fill="#ea580c" font-family="Arial,sans-serif" font-size="9.5" font-weight="bold" letter-spacing="0.5">SUPPLEMENT • ORAL SOLUTION</text>

  <!-- Product Illustration -->
  <g filter="url(#shadow_zinconia_sol)">
    <!-- Shadow -->
  <ellipse cx="200" cy="278" rx="60" ry="8" fill="#94a3b8" opacity="0.35"/>
  <!-- Measuring Cup on Cap -->
  <path d="M172 52 L228 52 L222 75 L178 75 Z" fill="#e0f2fe" opacity="0.85" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="184" y1="62" x2="198" y2="62" stroke="#0284c7" stroke-width="1"/>
  <line x1="184" y1="68" x2="202" y2="68" stroke="#0284c7" stroke-width="1"/>
  <!-- Bottle Cap -->
  <rect x="176" y="75" width="48" height="20" rx="3" fill="#ea580c" stroke="#c2410c" stroke-width="1"/>
  <!-- Bottle Neck -->
  <rect x="184" y="95" width="32" height="15" fill="#f97316"/>
  <!-- Liquid Bottle Body (Orange amber) -->
  <path d="M138 122 Q138 110 168 110 L232 110 Q262 110 262 122 L262 262 Q262 276 244 276 L156 276 Q138 276 138 262 Z" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/>
  <!-- Liquid highlight -->
  <rect x="144" y="118" width="8" height="150" rx="4" fill="#fed7aa" opacity="0.5"/>
  <!-- Bottle Label -->
  <rect x="146" y="132" width="108" height="122" rx="6" fill="#ffffff"/>
  <rect x="146" y="132" width="108" height="28" rx="6" fill="#f97316"/>
  <text x="200" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="12.5" fill="#ffffff" letter-spacing="0.5">ZINCONIA</text>
  <rect x="156" y="165" width="88" height="16" rx="3" fill="#fff7ed"/>
  <text x="200" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="8.5" fill="#ea580c">ORAL SOLUTION</text>
  <text x="200" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a">Zinc Acetate</text>
  <text x="200" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748b">20 mg / 5 ml</text>
  <line x1="165" y1="225" x2="235" y2="225" stroke="#fed7aa" stroke-width="1"/>
  <text x="200" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="10.5" fill="#ea580c">50 ml</text>
  </g>

  <!-- Product Labels Bottom -->
  <text x="200" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="20" fill="#1e293b">Zinconia Oral Solution</text>
  <text x="200" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">Zinc Acetate 20mg/5ml (50ml)</text>
  <text x="200" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Alkem</text>
</svg>