<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_fucidin_cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="shadow_fucidin_cream" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_fucidin_cream)" rx="20"/>
  
  <!-- Category Badge -->
  <rect x="24" y="20" width="204" height="22" rx="11" fill="#ffffff" opacity="0.9"/>
  <text x="35" y="35" fill="#ca8a04" font-family="Arial,sans-serif" font-size="9.5" font-weight="bold" letter-spacing="0.5">ANTIBIOTIC • TOPICAL CREAM</text>

  <!-- Product Illustration -->
  <g filter="url(#shadow_fucidin_cream)">
    <!-- Shadow -->
  <ellipse cx="200" cy="278" rx="50" ry="7" fill="#94a3b8" opacity="0.35"/>
  <!-- Tube Cap at Top -->
  <rect x="180" y="55" width="40" height="28" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="188" y1="58" x2="188" y2="80" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="196" y1="58" x2="196" y2="80" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="204" y1="58" x2="204" y2="80" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="212" y1="58" x2="212" y2="80" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Tube Body (Bright Yellow) -->
  <path d="M155 83 L155 255 Q155 275 175 275 L225 275 Q245 275 245 255 L245 83 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
  <!-- Crimp Top -->
  <rect x="154" y="80" width="92" height="10" rx="2" fill="#eab308" stroke="#ca8a04" stroke-width="1"/>
  <!-- Tube Label Banner -->
  <rect x="158" y="105" width="84" height="145" rx="6" fill="#ffffff" stroke="#ca8a04" stroke-width="1"/>
  <rect x="158" y="105" width="84" height="30" rx="6" fill="#dc2626"/>
  <text x="200" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="13" fill="#ffffff" letter-spacing="1">FUCIDIN</text>
  <rect x="168" y="142" width="64" height="18" rx="3" fill="#fef08a"/>
  <text x="200" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="9" fill="#a16207">2% CREAM</text>
  <text x="200" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#0f172a">Fusidic Acid</text>
  <text x="200" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#dc2626">LEO Pharma</text>
  <line x1="170" y1="215" x2="230" y2="215" stroke="#ca8a04" stroke-width="1"/>
  <text x="200" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#ca8a04">10 g</text>
  </g>

  <!-- Product Labels Bottom -->
  <text x="200" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="20" fill="#1e293b">Fucidin 2% Cream</text>
  <text x="200" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">Fusidic Acid Cream 2% (10g)</text>
  <text x="200" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Leo Pharma</text>
</svg>