<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_candid_powder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow_candid_powder" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_candid_powder)" rx="20"/>
  
  <!-- Category Badge -->
  <rect x="24" y="20" width="218" height="22" rx="11" fill="#ffffff" opacity="0.9"/>
  <text x="35" y="35" fill="#1d4ed8" font-family="Arial,sans-serif" font-size="9.5" font-weight="bold" letter-spacing="0.5">DERMATOLOGY • DUSTING POWDER</text>

  <!-- Product Illustration -->
  <g filter="url(#shadow_candid_powder)">
    <!-- Shadow -->
  <ellipse cx="200" cy="278" rx="60" ry="8" fill="#94a3b8" opacity="0.35"/>
  <!-- Shaker Dispensing Lid (with holes) -->
  <rect x="168" y="52" width="64" height="32" rx="6" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5"/>
  <circle cx="182" cy="62" r="2" fill="#ffffff"/>
  <circle cx="191" cy="62" r="2" fill="#ffffff"/>
  <circle cx="200" cy="62" r="2" fill="#ffffff"/>
  <circle cx="209" cy="62" r="2" fill="#ffffff"/>
  <circle cx="218" cy="62" r="2" fill="#ffffff"/>
  <line x1="168" y1="72" x2="232" y2="72" stroke="#1e40af" stroke-width="1"/>
  <!-- Powder Canister Body -->
  <rect x="138" y="84" width="124" height="190" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Blue bands -->
  <rect x="138" y="112" width="124" height="8" fill="#1d4ed8"/>
  <rect x="138" y="244" width="124" height="6" fill="#1d4ed8"/>
  <!-- Center Label -->
  <rect x="146" y="128" width="108" height="108" rx="6" fill="#1e40af"/>
  <text x="200" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="1">CANDID</text>
  <rect x="156" y="162" width="88" height="18" rx="3" fill="#ffffff"/>
  <text x="200" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="8.5" fill="#1e40af">DUSTING POWDER</text>
  <text x="200" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Clotrimazole 1%</text>
  <text x="200" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#93c5fd">Antifungal Relief</text>
  <text x="200" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" font-weight="bold" fill="#fbbf24">100 g</text>
  </g>

  <!-- Product Labels Bottom -->
  <text x="200" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="20" fill="#1e293b">Candid Dusting Powder</text>
  <text x="200" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">Clotrimazole Powder 1% (100g)</text>
  <text x="200" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Glenmark</text>
</svg>