<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_nasoclear_spray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow_nasoclear_spray" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_nasoclear_spray)" rx="20"/>
  
  <!-- Category Badge -->
  <rect x="24" y="20" width="148" height="22" rx="11" fill="#ffffff" opacity="0.9"/>
  <text x="35" y="35" fill="#0284c7" font-family="Arial,sans-serif" font-size="9.5" font-weight="bold" letter-spacing="0.5">NASAL CARE • SPRAY</text>

  <!-- Product Illustration -->
  <g filter="url(#shadow_nasoclear_spray)">
    <!-- Shadow -->
  <ellipse cx="200" cy="278" rx="56" ry="8" fill="#94a3b8" opacity="0.35"/>
  <!-- Spray Mist Droplets -->
  <circle cx="218" cy="28" r="3" fill="#38bdf8" opacity="0.8"/>
  <circle cx="228" cy="22" r="2" fill="#0ea5e9" opacity="0.6"/>
  <circle cx="236" cy="30" r="3.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="246" cy="24" r="2.5" fill="#7dd3fc" opacity="0.5"/>
  <!-- Nasal Applicator Nozzle Tip -->
  <path d="M194 38 L206 38 L206 65 L194 65 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="206" cy="42" r="1.5" fill="#0284c7"/>
  <!-- Spray Pump Finger Shoulder Rest -->
  <path d="M165 65 L235 65 L235 78 Q235 84 225 84 L175 84 Q165 84 165 78 Z" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="180" y="84" width="40" height="15" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <!-- Spray Bottle Body -->
  <rect x="142" y="99" width="116" height="174" rx="14" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="146" y="105" width="8" height="162" rx="4" fill="#f0f9ff"/>
  <!-- Bottle Label -->
  <rect x="150" y="128" width="100" height="126" rx="6" fill="#0ea5e9"/>
  <rect x="150" y="128" width="100" height="26" rx="6" fill="#0284c7"/>
  <text x="200" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="11.5" fill="#ffffff" letter-spacing="0.5">NASOCLEAR</text>
  <rect x="158" y="160" width="84" height="16" rx="3" fill="#ffffff"/>
  <text x="200" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="9" fill="#0284c7">SALINE SPRAY</text>
  <text x="200" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff">0.65% Isotonic</text>
  <text x="200" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#e0f2fe">Metered Dose</text>
  <line x1="165" y1="222" x2="235" y2="222" stroke="#38bdf8" stroke-width="1"/>
  <text x="200" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="11" fill="#ffffff">20 ml</text>
  </g>

  <!-- Product Labels Bottom -->
  <text x="200" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="20" fill="#1e293b">Nasoclear Saline Nasal Spray</text>
  <text x="200" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">Saline Nasal Spray 0.65% (20ml)</text>
  <text x="200" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Cipla</text>
</svg>