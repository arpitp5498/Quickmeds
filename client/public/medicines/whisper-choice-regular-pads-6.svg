<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_whisper_choice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow_whisper_choice" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_whisper_choice)" rx="20"/>
  
  <!-- Category Badge -->
  <rect x="24" y="20" width="162" height="22" rx="11" fill="#ffffff" opacity="0.9"/>
  <text x="35" y="35" fill="#0284c7" font-family="Arial,sans-serif" font-size="9.5" font-weight="bold" letter-spacing="0.5">FEMININE CARE • PADS</text>

  <!-- Product Illustration -->
  <g filter="url(#shadow_whisper_choice)">
    <!-- Shadow -->
  <ellipse cx="200" cy="278" rx="60" ry="8" fill="#94a3b8" opacity="0.35"/>
  <!-- Pack Body (Teal / Blue) -->
  <rect x="135" y="70" width="130" height="205" rx="14" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
  <!-- Floral / curved accent ribbon -->
  <path d="M135 155 Q175 130 200 150 T265 135 L265 261 Q265 275 251 275 L149 275 Q135 275 135 261 Z" fill="#0ea5e9" opacity="0.4"/>
  <!-- Magenta accent stripe -->
  <path d="M135 145 Q200 120 265 145" stroke="#ec4899" stroke-width="4" fill="none"/>
  <!-- Brand text -->
  <text x="200" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="16" fill="#ffffff" letter-spacing="0.5">whisper</text>
  <rect x="150" y="160" width="100" height="22" rx="4" fill="#ffffff"/>
  <text x="200" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="9" fill="#0369a1">CHOICE REGULAR</text>
  <!-- Wings emblem -->
  <text x="200" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Wings Protection</text>
  <text x="200" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#bae6fd">Upto 100% Stain Protection</text>
  <line x1="155" y1="230" x2="245" y2="230" stroke="#38bdf8" stroke-width="1"/>
  <text x="200" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="11" fill="#fef08a">6 Pads</text>
  </g>

  <!-- Product Labels Bottom -->
  <text x="200" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="20" fill="#1e293b">Whisper Choice Regular Pads</text>
  <text x="200" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">Sanitary Napkins with Wings (6s)</text>
  <text x="200" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">P&G</text>
</svg>