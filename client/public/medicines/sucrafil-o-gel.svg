<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_sucrafil_gel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow_sucrafil_gel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_sucrafil_gel)" rx="20"/>
  
  <!-- Category Badge -->
  <rect x="24" y="20" width="155" height="22" rx="11" fill="#ffffff" opacity="0.9"/>
  <text x="35" y="35" fill="#7c3aed" font-family="Arial,sans-serif" font-size="9.5" font-weight="bold" letter-spacing="0.5">GASTRO • SUSPENSION</text>

  <!-- Product Illustration -->
  <g filter="url(#shadow_sucrafil_gel)">
    <!-- Shadow -->
  <ellipse cx="200" cy="278" rx="60" ry="8" fill="#94a3b8" opacity="0.35"/>
  <!-- Measuring Cup / Cap -->
  <rect x="176" y="65" width="48" height="30" rx="4" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.5"/>
  <line x1="184" y1="72" x2="184" y2="88" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="200" y1="72" x2="200" y2="88" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="216" y1="72" x2="216" y2="88" stroke="#8b5cf6" stroke-width="1.5"/>
  <!-- Bottle Neck -->
  <rect x="184" y="95" width="32" height="15" fill="#e2e8f0"/>
  <!-- White Bottle Body -->
  <path d="M138 122 Q138 110 168 110 L232 110 Q262 110 262 122 L262 262 Q262 276 244 276 L156 276 Q138 276 138 262 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="144" y="118" width="8" height="150" rx="4" fill="#f8fafc"/>
  <!-- Bottle Label -->
  <rect x="146" y="132" width="108" height="122" rx="6" fill="#7c3aed"/>
  <rect x="146" y="132" width="108" height="28" rx="6" fill="#6d28d9"/>
  <text x="200" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="12" fill="#ffffff" letter-spacing="0.5">SUCRAFIL-O</text>
  <rect x="156" y="165" width="88" height="16" rx="3" fill="#ffffff"/>
  <text x="200" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="8.5" fill="#7c3aed">GEL SUSPENSION</text>
  <text x="200" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#ffffff">Sucralfate + Oxetacaine</text>
  <text x="200" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#ddd6fe">Sugar Free Formula</text>
  <line x1="165" y1="225" x2="235" y2="225" stroke="#a78bfa" stroke-width="1"/>
  <text x="200" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="10.5" fill="#ffffff">200 ml</text>
  </g>

  <!-- Product Labels Bottom -->
  <text x="200" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="20" fill="#1e293b">Sucrafil-O Gel</text>
  <text x="200" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">Sucralfate + Oxetacaine (200ml)</text>
  <text x="200" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Sun Pharma</text>
</svg>